<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stabat Mater - Avviso</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .avviso-wrap {
            max-width: 760px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.02);
            padding: clamp(2rem, 5vw, 4rem);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        .avviso-wrap h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 3vw, 2.8rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: var(--ink);
        }
        .avviso-wrap p {
            font-family: var(--font-body);
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            line-height: 1.6;
            color: #d4d0cb;
            margin-bottom: 2rem;
        }
        .avviso-wrap a {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
            display: inline-block;
            transition: var(--transition);
        }
        .avviso-wrap a:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="film-grain"></div>

    <div class="avviso-wrap">
        <h1>Stabat Mater </h1>
        <p>Questa pagina è in fase di creazione.</p>
        <a href="index.html#portfolio">Torna al portfolio</a>
    </div>
</body>
</html>
